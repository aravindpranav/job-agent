[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-agent"
version = "0.1.0"
description = "An AI agent that discovers fresh jobs on public ATS boards and scores their fit with an LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aravind Pranav" }]
keywords = ["jobs", "ats", "greenhouse", "lever", "ashby", "smartrecruiters", "llm", "anthropic"]

dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    # Slice 2 (resume tailoring): docx parsing, ATS PDF, PDF text-extraction gate.
    "python-docx>=1.1",
    "reportlab>=4.0",
    "pdfminer.six>=20240706",
    # Slice 4 (assisted apply): browser automation. After install, run once:
    #   playwright install chromium
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
job-agent = "job_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
